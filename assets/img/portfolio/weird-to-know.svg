<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1117"/>
      <stop offset="100%" style="stop-color:#1a1f2e"/>
    </linearGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e2433"/>
      <stop offset="100%" style="stop-color:#161b28"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Red top accent bar -->
  <rect x="0" y="0" width="600" height="5" fill="#cc0000"/>

  <!-- Trivia cards (background decoration) -->
  <rect x="52" y="118" width="130" height="90" rx="8" fill="url(#card1)" stroke="#2a3148" stroke-width="1.5" transform="rotate(-6 117 163)"/>
  <rect x="418" y="118" width="130" height="90" rx="8" fill="url(#card1)" stroke="#2a3148" stroke-width="1.5" transform="rotate(6 483 163)"/>
  <rect x="60" y="248" width="130" height="90" rx="8" fill="url(#card1)" stroke="#2a3148" stroke-width="1.5" transform="rotate(-4 125 293)"/>
  <rect x="410" y="248" width="130" height="90" rx="8" fill="url(#card1)" stroke="#2a3148" stroke-width="1.5" transform="rotate(4 475 293)"/>

  <!-- Question marks on cards -->
  <text x="117" y="172" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#2a3a5a" transform="rotate(-6 117 163)">?</text>
  <text x="483" y="172" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#2a3a5a" transform="rotate(6 483 163)">?</text>
  <text x="125" y="302" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#2a3a5a" transform="rotate(-4 125 293)">?</text>
  <text x="475" y="302" text-anchor="middle" font-family="Georgia,serif" font-size="36" font-weight="bold" fill="#2a3a5a" transform="rotate(4 475 293)">?</text>

  <!-- YouTube play button -->
  <rect x="258" y="108" width="84" height="60" rx="14" fill="#cc0000"/>
  <polygon points="285,123 285,153 315,138" fill="white"/>

  <!-- Title -->
  <text x="300" y="210" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="36" font-weight="bold"
        fill="white" letter-spacing="1">Weird to Know</text>

  <!-- Divider dots -->
  <circle cx="228" cy="230" r="2.5" fill="#cc0000"/>
  <circle cx="300" cy="230" r="2.5" fill="#cc0000"/>
  <circle cx="372" cy="230" r="2.5" fill="#cc0000"/>

  <!-- Subtitle -->
  <text x="300" y="262" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="14" fill="#8892a4" letter-spacing="3">TRIVIA · FACTS · HISTORY</text>

  <!-- Handle -->
  <text x="300" y="360" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="12" fill="#4a5568" letter-spacing="1">@WeirdtoKnow</text>

  <!-- Bottom red accent -->
  <rect x="0" y="395" width="600" height="5" fill="#cc0000" opacity="0.4"/>
</svg>
