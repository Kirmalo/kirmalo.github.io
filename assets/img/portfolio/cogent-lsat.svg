<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f1f3d"/>
      <stop offset="100%" style="stop-color:#1a3560"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#c8a84b"/>
      <stop offset="100%" style="stop-color:#e8cc7a"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" fill="url(#bg)"/>

  <!-- Top accent bar -->
  <rect x="0" y="0" width="600" height="5" fill="url(#accent)"/>

  <!-- Logo / Title -->
  <text x="300" y="72" text-anchor="middle" font-family="Georgia, serif" font-size="36" font-weight="bold" fill="#e8cc7a" letter-spacing="2">CogentLSAT</text>
  <text x="300" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#8a9fc0" letter-spacing="3">SMARTER LSAT PREP</text>

  <line x1="100" y1="115" x2="500" y2="115" stroke="#2a4070" stroke-width="1"/>

  <!-- Score card mockup -->
  <rect x="80" y="135" width="200" height="120" rx="8" fill="#162848" stroke="#2a4070" stroke-width="1"/>
  <text x="180" y="162" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8a9fc0" letter-spacing="1">PRACTICE SCORE</text>
  <text x="180" y="215" text-anchor="middle" font-family="Georgia,serif" font-size="52" font-weight="bold" fill="#e8cc7a">174</text>
  <text x="180" y="240" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#4a6a90">out of 180</text>

  <!-- Progress bars -->
  <rect x="310" y="135" width="210" height="120" rx="8" fill="#162848" stroke="#2a4070" stroke-width="1"/>
  <text x="415" y="158" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#8a9fc0" letter-spacing="1">SECTION SCORES</text>

  <text x="325" y="180" font-family="Arial,sans-serif" font-size="10" fill="#8a9fc0">Logical Reasoning</text>
  <rect x="325" y="184" width="180" height="6" rx="3" fill="#0f1f3d"/>
  <rect x="325" y="184" width="162" height="6" rx="3" fill="#c8a84b"/>

  <text x="325" y="206" font-family="Arial,sans-serif" font-size="10" fill="#8a9fc0">Analytical Reasoning</text>
  <rect x="325" y="210" width="180" height="6" rx="3" fill="#0f1f3d"/>
  <rect x="325" y="210" width="144" height="6" rx="3" fill="#c8a84b"/>

  <text x="325" y="232" font-family="Arial,sans-serif" font-size="10" fill="#8a9fc0">Reading Comprehension</text>
  <rect x="325" y="236" width="180" height="6" rx="3" fill="#0f1f3d"/>
  <rect x="325" y="236" width="153" height="6" rx="3" fill="#c8a84b"/>

  <!-- Tags -->
  <rect x="80" y="275" width="110" height="26" rx="13" fill="#1a3560"/>
  <text x="135" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8a84b">LSAT Prep</text>

  <rect x="200" y="275" width="110" height="26" rx="13" fill="#1a3560"/>
  <text x="255" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8a84b">Practice Tests</text>

  <rect x="320" y="275" width="110" height="26" rx="13" fill="#1a3560"/>
  <text x="375" y="293" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#c8a84b">Analytics</text>

  <!-- CTA -->
  <rect x="200" y="320" width="200" height="44" rx="22" fill="url(#accent)"/>
  <text x="300" y="348" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="bold" fill="#0f1f3d">Visit Site</text>

  <text x="300" y="390" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" fill="#2a4070">cogentlsat.com</text>
</svg>
