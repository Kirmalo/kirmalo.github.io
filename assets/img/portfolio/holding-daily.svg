<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <rect width="600" height="400" fill="#f5f0e6"/>

  <!-- Gold accent line top -->
  <rect x="180" y="148" width="240" height="1.5" fill="#c8a060"/>

  <!-- Main title -->
  <text x="300" y="218" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="72" font-weight="bold" font-style="italic"
        fill="#1a1208" letter-spacing="-1">Caselaw</text>

  <!-- Gold accent line bottom -->
  <rect x="180" y="232" width="240" height="1.5" fill="#c8a060"/>

  <!-- Tagline -->
  <text x="300" y="270" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="14" fill="#6b5c3e" letter-spacing="1">A daily puzzle for lawyers</text>

  <!-- URL -->
  <text x="300" y="360" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="11" fill="#b0a080" letter-spacing="1">holdingdaily.com</text>
